<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تطبيق الحكم</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0E1110;--s1:#171C19;--s2:#1F2622;--line:#2A322D;--line2:#222924;--tx:#F2F5F3;--tx2:#C9D1CC;--mut:#A3ADA7;--acc:#B5F04A;--on:#10140C;--amb:#F5B841;--yel:#F5D442;--red:#FF6B5E;--blu:#5AA9FF}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
main{flex:1;padding:24px 20px 16px;display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-size:26px;font-weight:700}
h2{margin:0;font-size:17px;font-weight:600}
.sec{margin:0;font-size:14px;font-weight:600;color:var(--mut)}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.col{display:flex;flex-direction:column;gap:12px}
.card{background:var(--s1);border-radius:16px;padding:14px 16px}
.hero{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
button,input,select,textarea{font-family:inherit}
.btn{height:50px;border:0;border-radius:14px;background:var(--acc);color:var(--on);font-size:16px;font-weight:700;cursor:pointer;padding:0 16px;width:100%}
.btn.ghost{background:var(--s1);color:var(--tx);border:1px solid var(--line);font-weight:600}
.btn.line{background:transparent;color:var(--acc);border:1px solid var(--acc);font-weight:600}
.btn.danger{background:transparent;color:var(--red);border:1px solid #5A2A26;font-weight:600}
.btn:active{transform:scale(.98)}
.link{background:none;border:0;color:var(--acc);font-size:14px;font-weight:500;cursor:pointer;min-height:44px;padding:0 4px}
.link.mut{color:var(--mut)}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:22px;background:var(--s1);border:1px solid var(--line);color:var(--tx);font-size:13px;font-weight:500;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.chip{font-size:12px;color:var(--tx2);background:var(--s2);border-radius:8px;padding:6px 10px}
.kit{width:44px;height:44px;border-radius:12px;border:2px solid var(--tx);flex-shrink:0}
.kit.s{width:36px;height:36px;border-radius:10px}
.bar{width:10px;height:22px;border-radius:3px;border:1px solid #3A443E}
.team{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.team span.n{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.stat b{display:block;font-size:28px;font-weight:700}
.item{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 14px;background:var(--s1);border-radius:14px;color:var(--tx);border:0;width:100%;text-align:right;cursor:pointer}
.item .t{flex:1;display:flex;flex-direction:column;min-width:0}
.item .sc{font-size:18px;font-weight:700;direction:ltr}
.empty{background:var(--s1);border:1px dashed var(--line);border-radius:16px;padding:22px 16px;text-align:center;color:var(--mut);font-size:14px;line-height:1.7}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--mut)}
.inp{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:16px;padding:0 14px;width:100%;min-width:0}
.inp:focus,.btn:focus-visible,.sw:focus-visible,.swatch:focus-visible,.seg button:focus-visible,.link:focus-visible,.item:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:44px;height:44px;border-radius:50%;padding:0;cursor:pointer;border:2px solid var(--bg);outline:2px solid transparent;outline-offset:2px}
.swatch[aria-pressed="true"]{outline-color:var(--acc)}
.list{background:var(--s1);border-radius:16px;padding:2px 14px}
.list>.li{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;border-bottom:1px solid var(--line2);font-size:15px}
.list>.li:last-child{border-bottom:0}
.step{display:flex;align-items:center;gap:6px}.step-inp{width:52px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:16px;font-weight:600;text-align:center;padding:0 4px;-moz-appearance:textfield}.step-inp::-webkit-inner-spin-button,.step-inp::-webkit-outer-spin-button{-webkit-appearance:none}
.step button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:20px;cursor:pointer}
.step span{min-width:56px;text-align:center;font-size:17px;font-weight:600}
.chk{width:24px;height:24px;accent-color:var(--acc)}
.seg{display:grid;gap:8px}
.seg.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg button{min-height:48px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;background:var(--s1);color:var(--tx);border:1px solid var(--line);padding:4px 6px}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--on);border-color:var(--acc)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{height:44px;padding:0 14px;border-radius:22px;font-size:13px;font-weight:600;cursor:pointer;background:var(--s1);color:var(--tx2);border:1px solid var(--line)}
.tabs button[aria-pressed="true"]{background:var(--tx);color:var(--on)}
.ev{display:flex;align-items:center;gap:12px;min-height:56px;border-bottom:1px solid var(--line2);padding:6px 0}
.ev:last-child{border-bottom:0}
.ev .m{width:44px;font-size:16px;font-weight:700;direction:ltr;text-align:right;flex-shrink:0}
.ev .mk{width:14px;height:20px;flex-shrink:0}
.ev .t{flex:1;display:flex;flex-direction:column;min-width:0}
.ev .del{width:44px;height:44px;border:0;background:none;color:var(--mut);font-size:20px;cursor:pointer;flex-shrink:0}
.score{font-size:44px;font-weight:700;direction:ltr;white-space:nowrap}
.err{color:var(--red);font-size:13px;min-height:18px}
.sw{width:52px;height:44px;padding:0;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;flex-shrink:0}
.sw i{width:52px;height:30px;border-radius:15px;background:#3A443E;display:flex;align-items:center;justify-content:flex-end;padding:0 3px}
.sw i::after{content:"";width:24px;height:24px;border-radius:50%;background:var(--tx)}
.sw[aria-checked="true"] i{background:var(--acc);justify-content:flex-start}
.sw[aria-checked="true"] i::after{background:var(--on)}
nav{position:sticky;bottom:0;padding:10px 20px 16px;background:var(--bg)}
nav div{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--s1);border-radius:18px;padding:6px}
nav button{height:46px;border:0;border-radius:12px;background:none;color:var(--mut);font-size:13px;font-weight:500;cursor:pointer}
nav button[aria-current="page"]{background:var(--line);color:var(--tx);font-weight:600}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--tx);color:var(--on);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;max-width:88vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
textarea.inp{height:180px;padding:12px 14px;line-height:1.6;direction:rtl}
.note{background:#1B2114;border:1px solid #3B4A22;color:#D5E8A8;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.7}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
var KEY='refapp.v1';
var COLORS=[['red','أحمر','#E5484D'],['blue','أزرق','#3E8EF7'],['yellow','أصفر','#F5D442'],['green','أخضر','#2FA866'],['white','أبيض','#F2F5F3'],['black','أسود','#2B2B2B'],['orange','برتقالي','#F08A3C'],['purple','بنفسجي','#8E6BE8']];
var ROLES=[['ar1','مساعد أول'],['ar2','مساعد ثانٍ']];
var KINDS=[['goal','هدف'],['yellow','صفراء'],['red','حمراء'],['sub','تبديل'],['stop','توقف إصابة']];
var DEF={matches:[],settings:{half:45,brk:15,end:true,added:false,brkAlert:true,second:true,gps:true}};
var mem=null;
function load(){
  var d=null;
  try{d=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  if(!d||!Array.isArray(d.matches))d=JSON.parse(JSON.stringify(DEF));
  for(var k in DEF.settings)if(d.settings==null||d.settings[k]===undefined){d.settings=d.settings||{};d.settings[k]=DEF.settings[k];}
  return d;
}
var db=load();
var stored=true;
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));stored=true;}catch(e){stored=false;}}
var ui={view:'home',matchId:null,filter:'all',draft:null,ev:null,confirmDel:false,reportText:null,err:''};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function hex(id){for(var i=0;i<COLORS.length;i++)if(COLORS[i][0]===id)return COLORS[i][2];return '#888';}
function roleName(id){for(var i=0;i<ROLES.length;i++)if(ROLES[i][0]===id)return ROLES[i][1];return '';}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function fmtDate(s){
  if(!s)return 'بدون موعد';
  var d=new Date(s);if(isNaN(d))return 'بدون موعد';
  try{return new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-latn',{weekday:'long',day:'numeric',month:'long',hour:'numeric',minute:'2-digit'}).format(d);}catch(e){return d.toLocaleString();}
}
function getMatch(id){for(var i=0;i<db.matches.length;i++)if(db.matches[i].id===id)return db.matches[i];return null;}
function score(m){var h=0,a=0;m.events.forEach(function(e){if(e.kind==='goal'){if(e.team==='home')h++;else a++;}});return[h,a];}
function count(m,k){return m.events.filter(function(e){return e.kind===k;}).length;}
function stopSecs(m){var t=0;m.events.forEach(function(e){if(e.kind==='stop')t+=e.dur||0;});return t;}
function mmss(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function sorted(){return db.matches.slice().sort(function(a,b){return String(b.date||'').localeCompare(String(a.date||''));});}
function nextMatch(){
  var up=db.matches.filter(function(m){return m.status!=='done';});
  up.sort(function(a,b){return String(a.date||'9').localeCompare(String(b.date||'9'));});
  return up[0]||null;
}
var toastT;
function toast(t){var el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove('on');},2600);}
function go(v,id){ui.view=v;if(id!==undefined)ui.matchId=id;ui.confirmDel=false;ui.reportText=null;ui.ev=null;ui.err='';
  var h={home:'home',new:'new-match',reports:'reports',match:'match',perf:'performance',watch:'watch'}[v];
  try{if(location.hash!=='#'+h)history.replaceState(null,'','#'+h);}catch(e){}
  render();window.scrollTo(0,0);}

function teamsRow(m,small){
  return '<div class="row"><div class="team"><span class="kit'+(small?' s':'')+'" style="background:'+hex(m.home.color)+'"></span><span class="n">'+esc(m.home.name)+'</span></div>'+
  (small?'<span class="score num">'+score(m)[0]+' – '+score(m)[1]+'</span>':'<span class="mut sm">ضد</span>')+
  '<div class="team"><span class="kit'+(small?' s':'')+'" style="background:'+hex(m.away.color)+'"></span><span class="n">'+esc(m.away.name)+'</span></div></div>';
}
function matchItem(m){
  var s=score(m);
  return '<button class="item" data-act="open" data-id="'+m.id+'"><span style="display:flex;gap:4px"><span class="bar" style="background:'+hex(m.home.color)+'"></span><span class="bar" style="background:'+hex(m.away.color)+'"></span></span>'+
  '<span class="t"><span style="font-size:15px;font-weight:500">'+esc(m.home.name)+' × '+esc(m.away.name)+'</span><span class="xs mut">'+esc(fmtDate(m.date))+(m.status==='done'?' · منتهية':' · قادمة')+'</span></span>'+
  '<span class="sc num">'+(m.status==='done'||m.events.length?s[0]+' – '+s[1]:'—')+'</span></button>';
}

function vHome(){
  var n=nextMatch(),done=db.matches.filter(function(m){return m.status==='done';});
  var y=0,r=0;db.matches.forEach(function(m){y+=count(m,'yellow');r+=count(m,'red');});
  var h='<div class="row"><div><div class="mut" style="font-size:14px">لوحة الحكم</div><h1>مبارياتي</h1></div><button class="pill" data-act="nav" data-v="watch"><span class="dot"></span>الساعة غير مربوطة</button></div>';
  if(!stored)h+='<div class="note">التخزين غير متاح في هذا المتصفح، فالبيانات تبقى حتى إغلاق الصفحة فقط.</div>';
  if(n){
    h+='<div class="hero"><div class="row"><span class="sm" style="font-weight:600;color:var(--acc)">المباراة القادمة</span><span class="sm mut">'+esc(fmtDate(n.date))+'</span></div>'+teamsRow(n,false)+
    '<div style="display:flex;gap:8px;flex-wrap:wrap"><span class="chip num">2 × '+n.half+' د</span><span class="chip num">استراحة '+n.brk+' د</span><span class="chip">'+esc(roleName(n.role))+'</span>'+(n.et?'<span class="chip">أشواط إضافية</span>':'')+(n.pk?'<span class="chip">ركلات ترجيح</span>':'')+'</div>'+
    '<button class="btn" data-act="open" data-id="'+n.id+'">فتح المباراة</button></div>';
  }else{
    h+='<div class="empty">لا توجد مباراة قادمة.<br>أنشئ مباراتك الأولى وستظهر هنا.</div>';
  }
  h+='<div class="grid2"><div class="card stat"><b class="num">'+done.length+'</b><span class="sm mut">مباراة منتهية</span></div><div class="card stat"><b class="num">'+(db.matches.length-done.length)+'</b><span class="sm mut">مباراة قادمة</span></div><div class="card stat"><b class="num" style="color:var(--yel)">'+y+'</b><span class="sm mut">بطاقة صفراء</span></div><div class="card stat"><b class="num" style="color:var(--red)">'+r+'</b><span class="sm mut">بطاقة حمراء</span></div></div>';
  var rec=sorted().slice(0,3);
  if(rec.length){h+='<div class="col" style="gap:10px"><div class="row"><h2>آخر المباريات</h2><button class="link" data-act="nav" data-v="reports">عرض الكل</button></div>'+rec.map(matchItem).join('')+'</div>';}
  h+='<button class="btn line" data-act="new">+ مباراة جديدة</button>';
  return h;
}

function newDraft(){var d=new Date();d.setMinutes(0,0,0);d.setHours(d.getHours()+1);var p=function(n){return String(n).padStart(2,'0');};
  return{home:'',away:'',hc:'red',ac:'blue',half:db.settings.half,brk:db.settings.brk,et:false,pk:false,date:d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes()),comp:'',venue:'',role:'ar1'};}
function val(id){var el=document.getElementById(id);return el?el.value:'';}
function syncDraft(){var d=ui.draft;if(!d||!document.getElementById('f-home'))return;
  d.home=val('f-home');d.away=val('f-away');d.date=val('f-date');d.comp=val('f-comp');d.venue=val('f-venue');
  d.et=document.getElementById('f-et').checked;d.pk=document.getElementById('f-pk').checked;}
function swatches(key,cur){return '<div class="swatches">'+COLORS.map(function(c){return '<button type="button" class="swatch" style="background:'+c[2]+'" aria-label="'+c[1]+'" aria-pressed="'+(cur===c[0])+'" data-act="color" data-k="'+key+'" data-c="'+c[0]+'"></button>';}).join('')+'</div>';}
function stepper(k,v,label){return '<div class="li"><span>'+label+'</span><div class="step"><button type="button" aria-label="إنقاص '+label+'" data-act="step" data-k="'+k+'" data-d="-5">−</button><input type="number" class="step-inp num" data-act="step-inp" data-k="'+k+'" value="'+v+'" min="1" max="120" aria-label="'+label+'"><span class="mut sm">د</span><button type="button" aria-label="زيادة '+label+'" data-act="step" data-k="'+k+'" data-d="5">+</button></div></div>';}
function vNew(){
  var d=ui.draft;
  return '<div class="row"><h1>مباراة جديدة</h1><button class="link mut" data-act="nav" data-v="home">إلغاء</button></div>'+
  '<div class="col"><p class="sec">الفريقان</p>'+
  '<div class="card col"><div class="field"><label for="f-home">صاحب الأرض</label><input class="inp" id="f-home" maxlength="30" placeholder="اسم الفريق" value="'+esc(d.home)+'"></div>'+swatches('hc',d.hc)+'</div>'+
  '<div class="card col"><div class="field"><label for="f-away">الضيف</label><input class="inp" id="f-away" maxlength="30" placeholder="اسم الفريق" value="'+esc(d.away)+'"></div>'+swatches('ac',d.ac)+'</div></div>'+
  '<div class="col"><p class="sec">التوقيت</p><div class="list">'+stepper('half',d.half,'مدة الشوط')+stepper('brk',d.brk,'الاستراحة')+
  '<div class="li"><label for="f-et">أشواط إضافية</label><input class="chk" type="checkbox" id="f-et"'+(d.et?' checked':'')+'></div>'+
  '<div class="li"><label for="f-pk">ركلات ترجيح</label><input class="chk" type="checkbox" id="f-pk"'+(d.pk?' checked':'')+'></div></div></div>'+
  '<div class="col"><p class="sec">تفاصيل المباراة</p><div class="card col">'+
  '<div class="field"><label for="f-date">الموعد</label><input class="inp" type="datetime-local" id="f-date" value="'+esc(d.date)+'"></div>'+
  '<div class="field"><label for="f-comp">المسابقة</label><input class="inp" id="f-comp" maxlength="40" placeholder="دوري الدرجة الثانية" value="'+esc(d.comp)+'"></div>'+
  '<div class="field"><label for="f-venue">الملعب</label><input class="inp" id="f-venue" maxlength="40" placeholder="ملعب المدينة الرياضية" value="'+esc(d.venue)+'"></div></div></div>'+
  '<div class="col"><p class="sec">حكم مساعد</p><div class="seg c2">'+ROLES.map(function(r){return '<button type="button" aria-pressed="'+(d.role===r[0])+'" data-act="role" data-r="'+r[0]+'">'+r[1]+'</button>';}).join('')+'</div></div>'+
  '<div class="err" role="alert">'+esc(ui.err)+'</div><button class="btn" data-act="save-match">حفظ المباراة</button>';
}

function vReports(){
  var l=sorted();
  return '<div class="row"><h1>التقارير</h1><button class="link" data-act="new">+ جديدة</button></div>'+
  (l.length?'<div class="col" style="gap:10px">'+l.map(matchItem).join('')+'</div>':'<div class="empty">لا توجد مباريات بعد.<br>كل مباراة تحفظها تظهر هنا مع تقريرها.</div>');
}

function evView(m,e){
  var team=e.team==='home'?m.home:m.away,mark,rad='50%',title,detail=[];
  if(e.kind!=='stop')detail.push(team.name);
  if(e.kind==='goal'){mark='#F2F5F3';title='هدف';if(e.player)detail.push('رقم '+e.player);}
  else if(e.kind==='yellow'){mark='#F5D442';rad='3px';title='بطاقة صفراء';if(e.player)detail.push('رقم '+e.player);}
  else if(e.kind==='red'){mark='#FF6B5E';rad='3px';title=e.second?'صفراء ثانية · طرد':'بطاقة حمراء';if(e.player)detail.push('رقم '+e.player);}
  else if(e.kind==='sub'){mark='#5AA9FF';title='تبديل';if(e.inP)detail.push('دخول '+e.inP);if(e.outP)detail.push('خروج '+e.outP);}
  else{mark='#F5B841';title='توقف للإصابة';detail.push('المدة '+mmss(e.dur||0));}
  if(e.note)detail.push(e.note);
  return{mark:mark,rad:rad,title:title,detail:detail.join(' · '),color:e.kind==='stop'?'transparent':hex(team.color)};
}
function evForm(m){
  var e=ui.ev,k=e.kind,h='<div class="card col"><div class="row"><h2>تسجيل حدث</h2><button class="link mut" data-act="ev-cancel">إلغاء</button></div>'+
  '<div class="seg c3">'+KINDS.map(function(x){return '<button type="button" aria-pressed="'+(k===x[0])+'" data-act="ev-kind" data-k="'+x[0]+'">'+x[1]+'</button>';}).join('')+'</div>';
  if(k!=='stop')h+='<div class="seg c2"><button type="button" aria-pressed="'+(e.team==='home')+'" data-act="ev-team" data-t="home">'+esc(m.home.name)+'</button><button type="button" aria-pressed="'+(e.team==='away')+'" data-act="ev-team" data-t="away">'+esc(m.away.name)+'</button></div>';
  h+='<div class="grid2"><div class="field"><label for="e-min">الدقيقة</label><input class="inp num" id="e-min" type="number" inputmode="numeric" min="1" max="130" placeholder="67" value="'+esc(e.min)+'"></div>';
  if(k==='goal'||k==='yellow'||k==='red')h+='<div class="field"><label for="e-player">رقم اللاعب</label><input class="inp num" id="e-player" type="number" inputmode="numeric" min="1" max="99" placeholder="7" value="'+esc(e.player)+'"></div>';
  if(k==='sub')h+='<div class="field"><label for="e-out">رقم الخارج</label><input class="inp num" id="e-out" type="number" inputmode="numeric" min="1" max="99" placeholder="8" value="'+esc(e.outP)+'"></div>';
  if(k==='stop')h+='<div class="field"><label for="e-dm">مدة التوقف (دقائق)</label><input class="inp num" id="e-dm" type="number" inputmode="numeric" min="0" max="30" placeholder="1" value="'+esc(e.dm)+'"></div>';
  h+='</div>';
  if(k==='sub')h+='<div class="field"><label for="e-in">رقم الداخل</label><input class="inp num" id="e-in" type="number" inputmode="numeric" min="1" max="99" placeholder="14" value="'+esc(e.inP)+'"></div>';
  if(k==='stop')h+='<div class="field"><label for="e-ds">ثوانٍ إضافية</label><input class="inp num" id="e-ds" type="number" inputmode="numeric" min="0" max="59" placeholder="30" value="'+esc(e.ds)+'"></div>';
  if(k==='yellow'||k==='red')h+='<div class="field"><label for="e-note">السبب (اختياري)</label><input class="inp" id="e-note" maxlength="40" placeholder="سلوك غير رياضي" value="'+esc(e.note)+'"></div>';
  h+='<div class="err" role="alert">'+esc(ui.err)+'</div><button class="btn" data-act="ev-save">إضافة الحدث</button></div>';
  return h;
}
function syncEv(){var e=ui.ev;if(!e||!document.getElementById('e-min'))return;
  e.min=val('e-min');['player','outP','inP','dm','ds','note'].forEach(function(f){var id={player:'e-player',outP:'e-out',inP:'e-in',dm:'e-dm',ds:'e-ds',note:'e-note'}[f];if(document.getElementById(id))e[f]=val(id);});}
function vMatch(){
  var m=getMatch(ui.matchId);if(!m)return vReports();
  var evs=m.events.slice().sort(function(a,b){return a.min-b.min;});
  var shown=evs.filter(function(e){return ui.filter==='all'||(ui.filter==='goal'&&e.kind==='goal')||(ui.filter==='card'&&(e.kind==='yellow'||e.kind==='red'));});
  var h='<div class="row"><h1>تقرير المباراة</h1><button class="link mut" data-act="nav" data-v="reports">رجوع</button></div>'+
  '<div class="hero">'+teamsRow(m,true)+'<span class="sm mut" style="text-align:center">'+esc(fmtDate(m.date))+' · '+esc(roleName(m.role))+(m.comp?' · '+esc(m.comp):'')+(m.venue?' · '+esc(m.venue):'')+'</span>'+
  '<span class="chip" style="align-self:center">'+(m.status==='done'?'منتهية':'قادمة')+'</span></div>'+
  '<div class="grid2"><div class="card field"><label for="a1">بدل ضائع · الشوط الأول</label><input class="inp num" id="a1" type="number" inputmode="numeric" min="0" max="30" data-ch="added1" value="'+(m.added1||0)+'"></div>'+
  '<div class="card field"><label for="a2">بدل ضائع · الشوط الثاني</label><input class="inp num" id="a2" type="number" inputmode="numeric" min="0" max="30" data-ch="added2" value="'+(m.added2||0)+'"></div>'+
  '<div class="card stat"><span class="sm mut">توقف للإصابات</span><b class="num" style="font-size:20px">'+mmss(stopSecs(m))+'</b></div>'+
  '<div class="card stat"><span class="sm mut">البطاقات</span><b class="num" style="font-size:20px"><span style="color:var(--yel)">'+count(m,'yellow')+'</span> <span class="mut">·</span> <span style="color:var(--red)">'+count(m,'red')+'</span></b></div></div>';
  if(ui.ev)h+=evForm(m);else h+='<button class="btn" data-act="ev-new">+ تسجيل حدث</button>';
  h+='<div class="col" style="gap:10px"><div class="row"><h2>الأحداث</h2><div class="tabs">'+[['all','الكل'],['goal','أهداف'],['card','بطاقات']].map(function(f){return '<button aria-pressed="'+(ui.filter===f[0])+'" data-act="filter" data-f="'+f[0]+'">'+f[1]+'</button>';}).join('')+'</div></div>';
  if(shown.length){h+='<div class="list">'+shown.map(function(e){var v=evView(m,e);return '<div class="ev"><span class="m num">'+e.min+"'"+'</span><span class="mk" aria-hidden="true" style="background:'+v.mark+';border-radius:'+v.rad+'"></span><span class="t"><span style="font-size:15px;font-weight:500">'+v.title+'</span><span class="xs mut">'+esc(v.detail)+'</span></span><span aria-hidden="true" style="width:8px;height:24px;border-radius:3px;background:'+v.color+'"></span><button class="del" aria-label="حذف الحدث" data-act="ev-del" data-id="'+e.id+'">×</button></div>';}).join('')+'</div>';}
  else h+='<div class="empty">'+(m.events.length?'لا توجد أحداث بهذا التصنيف.':'لم يُسجَّل أي حدث بعد.')+'</div>';
  h+='</div><div class="grid2"><button class="btn ghost" data-act="toggle-done">'+(m.status==='done'?'إعادة فتح المباراة':'إنهاء المباراة')+'</button><button class="btn ghost" data-act="copy">نسخ التقرير</button></div>';
  if(ui.reportText!==null)h+='<div class="field"><label for="rep">انسخ التقرير يدوياً</label><textarea class="inp" id="rep" readonly>'+esc(ui.reportText)+'</textarea></div>';
  h+=ui.confirmDel?'<div class="card col"><span>حذف هذه المباراة وكل أحداثها؟</span><div class="grid2"><button class="btn danger" data-act="del-yes">حذف</button><button class="btn ghost" data-act="del-no">تراجع</button></div></div>':'<button class="btn danger" data-act="del-ask">حذف المباراة</button>';
  return h;
}
function reportText(m){
  var s=score(m),L=[];
  L.push(m.home.name+' '+s[0]+' – '+s[1]+' '+m.away.name);
  L.push(fmtDate(m.date)+(m.comp?' · '+m.comp:'')+(m.venue?' · '+m.venue:''));
  L.push('الدور: '+roleName(m.role));
  L.push('الوقت: '+m.half+'+'+(m.added1||0)+' / '+m.half+'+'+(m.added2||0)+' · توقف الإصابات '+mmss(stopSecs(m)));
  L.push('البطاقات: '+count(m,'yellow')+' صفراء · '+count(m,'red')+' حمراء');
  L.push('');L.push('الأحداث:');
  m.events.slice().sort(function(a,b){return a.min-b.min;}).forEach(function(e){var v=evView(m,e);L.push(e.min+"' "+v.title+' — '+v.detail);});
  if(!m.events.length)L.push('لا توجد أحداث');
  return L.join('\n');
}

function vPerf(){
  return '<h1>الأداء</h1><div class="empty">بيانات الأداء تأتي من الساعة.<br>بعد ربط تطبيق الساعة ستظهر هنا لكل مباراة.</div>'+
  '<div class="col"><p class="sec">ما سيظهر هنا</p><div class="list"><div class="li"><span>خريطة التمركز على الملعب</span></div><div class="li"><span>المسافة والانطلاقات</span></div><div class="li"><span>أعلى سرعة ومتوسط النبض</span></div><div class="li"><span>توزيع السرعة لكل شوط</span></div></div></div>';
}
function sw(k,label,hint){var on=!!db.settings[k];return '<div class="li" style="min-height:60px"><span style="display:flex;flex-direction:column"><span>'+label+'</span><span class="xs mut">'+hint+'</span></span><button class="sw" role="switch" aria-checked="'+on+'" aria-label="'+label+'" data-act="set" data-k="'+k+'"><i></i></button></div>';}
function vWatch(){
  var s=db.settings;
  return '<h1>الساعة</h1><div class="hero"><div style="display:flex;align-items:center;gap:14px"><div aria-hidden="true" class="num" style="width:56px;height:56px;border-radius:50%;border:3px solid #3A443E;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--mut)">'+s.half+':00</div><div><div style="font-size:17px;font-weight:600;direction:ltr;text-align:right">vívoactive 5</div><div class="sm mut" style="display:flex;align-items:center;gap:6px"><span class="dot"></span>غير مربوطة بعد</div></div></div>'+
  '<div class="note">الربط يُفعَّل بعد بناء تطبيق الساعة. الإعدادات أدناه محفوظة وستُرسل للساعة عند الربط.</div></div>'+
  '<div class="col"><p class="sec">تنبيهات الساعة</p><div class="list">'+sw('end','اهتزاز عند نهاية الوقت الأصلي','عند نهاية كل شوط')+sw('added','اهتزاز عند نهاية بدل الضائع','بعد الدقائق المضافة')+sw('brkAlert','تنبيه قبل نهاية الاستراحة','قبل دقيقتين')+sw('second','صفراء ثانية = طرد تلقائي','لنفس رقم اللاعب')+sw('gps','تسجيل التحركات','خريطة حرارية ومسافة')+'</div></div>'+
  '<div class="col"><p class="sec">الإعدادات الافتراضية</p><div class="list">'+
  '<div class="li"><span>مدة الشوط</span><div class="step"><button aria-label="إنقاص مدة الشوط" data-act="sstep" data-k="half" data-d="-5">−</button><input type="number" class="step-inp num" data-act="sstep-inp" data-k="half" value="'+s.half+'" min="1" max="120" aria-label="مدة الشوط"><span class="mut sm">د</span><button aria-label="زيادة مدة الشوط" data-act="sstep" data-k="half" data-d="5">+</button></div></div>'+
  '<div class="li"><span>الاستراحة</span><div class="step"><button aria-label="إنقاص الاستراحة" data-act="sstep" data-k="brk" data-d="-5">−</button><input type="number" class="step-inp num" data-act="sstep-inp" data-k="brk" value="'+s.brk+'" min="1" max="120" aria-label="الاستراحة"><span class="mut sm">د</span><button aria-label="زيادة الاستراحة" data-act="sstep" data-k="brk" data-d="5">+</button></div></div>'+
  '<div class="li"><span>عرض المؤقت</span><span class="mut sm">تصاعدي متصل ('+(s.half+1)+'، '+(s.half+2)+'…)</span></div></div></div>';
}

function render(){
  var v=ui.view,body={home:vHome,new:vNew,reports:vReports,match:vMatch,perf:vPerf,watch:vWatch}[v]();
  var tab={home:'home',new:'home',reports:'reports',match:'reports',perf:'perf',watch:'watch'}[v];
  var nav='<nav aria-label="التنقل"><div>'+[['home','الرئيسية'],['reports','التقارير'],['perf','الأداء'],['watch','الساعة']].map(function(t){return '<button data-act="nav" data-v="'+t[0]+'"'+(tab===t[0]?' aria-current="page"':'')+'>'+t[1]+'</button>';}).join('')+'</div></nav>';
  document.getElementById('app').innerHTML='<main>'+body+'</main>'+nav;
}
function clamp(n,a,b){return Math.max(a,Math.min(b,n));}

document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act,m=getMatch(ui.matchId);
  if(a==='nav')return go(b.dataset.v);
  if(a==='new'){ui.draft=newDraft();return go('new');}
  if(a==='open'){ui.filter='all';return go('match',b.dataset.id);}
  if(a==='color'){syncDraft();ui.draft[b.dataset.k]=b.dataset.c;return render();}
  if(a==='role'){syncDraft();ui.draft.role=b.dataset.r;return render();}
  if(a==='step'){syncDraft();var k=b.dataset.k;ui.draft[k]=clamp(ui.draft[k]+(+b.dataset.d),1,120);return render();}
  if(a==='save-match'){
    syncDraft();var d=ui.draft;
    if(!d.home.trim()||!d.away.trim()){ui.err='اكتب اسم الفريقين أولاً.';return render();}
    if(d.hc===d.ac){ui.err='اختر لونين مختلفين للفريقين.';return render();}
    var nm={id:uid(),home:{name:d.home.trim(),color:d.hc},away:{name:d.away.trim(),color:d.ac},half:d.half,brk:d.brk,et:d.et,pk:d.pk,date:d.date,comp:d.comp.trim(),venue:d.venue.trim(),role:d.role,status:'upcoming',events:[],added1:0,added2:0};
    db.matches.push(nm);save();ui.draft=null;toast('حُفظت المباراة');return go('match',nm.id);
  }
  if(a==='set'){db.settings[b.dataset.k]=!db.settings[b.dataset.k];save();return render();}
  if(a==='sstep'){var sk=b.dataset.k;db.settings[sk]=clamp(db.settings[sk]+(+b.dataset.d),1,120);save();return render();}
  if(a==='step-inp'){syncDraft();var k=b.dataset.k;var v=parseInt(b.value,10);if(!isNaN(v)&&v>0){ui.draft[k]=clamp(v,1,120);}return;}
  if(a==='sstep-inp'){var sk=b.dataset.k;var v=parseInt(b.value,10);if(!isNaN(v)&&v>0){db.settings[sk]=clamp(v,1,120);save();}return;}
  if(!m)return;
  if(a==='filter'){syncEv();ui.filter=b.dataset.f;return render();}
  if(a==='ev-new'){ui.ev={kind:'goal',team:'home',min:'',player:'',outP:'',inP:'',dm:'',ds:'',note:''};ui.err='';return render();}
  if(a==='ev-cancel'){ui.ev=null;ui.err='';return render();}
  if(a==='ev-kind'){syncEv();ui.ev.kind=b.dataset.k;ui.err='';return render();}
  if(a==='ev-team'){syncEv();ui.ev.team=b.dataset.t;return render();}
  if(a==='ev-save'){
    syncEv();var e=ui.ev,min=parseInt(e.min,10);
    if(!(min>=1&&min<=130)){ui.err='اكتب الدقيقة (من 1 إلى 130).';return render();}
    var o={id:uid(),kind:e.kind,min:min,team:e.team};
    if(e.kind==='goal'||e.kind==='yellow'||e.kind==='red')o.player=String(e.player||'').trim();
    if(e.kind==='yellow'||e.kind==='red')o.note=String(e.note||'').trim();
    if(e.kind==='sub'){o.outP=String(e.outP||'').trim();o.inP=String(e.inP||'').trim();if(!o.outP||!o.inP){ui.err='اكتب رقم الداخل والخارج.';return render();}}
    if(e.kind==='stop'){o.dur=(parseInt(e.dm,10)||0)*60+clamp(parseInt(e.ds,10)||0,0,59);if(o.dur<=0){ui.err='اكتب مدة التوقف.';return render();}}
    var second=e.kind==='yellow'&&o.player&&db.settings.second&&m.events.some(function(x){return x.kind==='yellow'&&x.team===o.team&&x.player===o.player;});
    m.events.push(o);
    if(second)m.events.push({id:uid(),kind:'red',min:min,team:o.team,player:o.player,second:true,note:''});
    save();ui.ev=null;ui.err='';toast(second?'صفراء ثانية: سُجّل الطرد تلقائياً':'أُضيف الحدث');return render();
  }
  if(a==='ev-del'){m.events=m.events.filter(function(x){return x.id!==b.dataset.id;});save();return render();}
  if(a==='toggle-done'){m.status=m.status==='done'?'upcoming':'done';save();return render();}
  if(a==='copy'){
    var t=reportText(m);
    var fail=function(){ui.reportText=t;render();};
    try{navigator.clipboard.writeText(t).then(function(){toast('نُسخ التقرير');},fail);}catch(x){fail();}
    return;
  }
  if(a==='del-ask'){ui.confirmDel=true;return render();}
  if(a==='del-no'){ui.confirmDel=false;return render();}
  if(a==='del-yes'){db.matches=db.matches.filter(function(x){return x.id!==m.id;});save();toast('حُذفت المباراة');return go('reports',null);}
});
document.addEventListener('change',function(ev){
  var a=ev.target.dataset&&ev.target.dataset.act;
  if(a==='step-inp'){syncDraft();var k=ev.target.dataset.k;var v=parseInt(ev.target.value,10);if(!isNaN(v)&&v>0){ui.draft[k]=clamp(v,1,120);}render();return;}
  if(a==='sstep-inp'){var sk=ev.target.dataset.k;var v=parseInt(ev.target.value,10);if(!isNaN(v)&&v>0){db.settings[sk]=clamp(v,1,120);save();}render();return;}
  var k=ev.target.dataset&&ev.target.dataset.ch;if(!k)return;
  var m=getMatch(ui.matchId);if(!m)return;
  m[k]=clamp(parseInt(ev.target.value,10)||0,0,30);ev.target.value=m[k];save();
});
function fromHash(){
  var h=(location.hash||'').slice(1);
  var v={home:'home','new-match':'new',reports:'reports',match:'match',performance:'perf',watch:'watch'}[h]||'home';
  if(v==='new'&&!ui.draft)ui.draft=newDraft();
  if(v==='match'&&!getMatch(ui.matchId))v='reports';
  ui.view=v;render();
}
window.addEventListener('hashchange',fromHash);
save();
fromHash();
})();
</script>
</body>
</html>
